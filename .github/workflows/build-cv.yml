name: Build academic CV PDF
on:
  push:
    paths:
      - 'Daerhan_Jianati_CV.tex'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended cm-super
      - name: Compile two-page CV
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Daerhan_Jianati_CV.tex
          pdflatex -interaction=nonstopmode -halt-on-error Daerhan_Jianati_CV.tex
          pdfinfo Daerhan_Jianati_CV.pdf | grep 'Pages:'
      - name: Publish CV at stable website URL
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Daerhan_Jianati_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Update academic CV PDF'
            git push
          fi
